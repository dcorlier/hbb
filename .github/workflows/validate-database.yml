# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: develop - Database PR Validation

on:  
  pull_request:
    branches: [ "develop" ]

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      databasechanged: ${{ steps.check.outputs.databasefolder }}
    steps:
      - name: check for changes in database folder
        id: check
        uses: dorny/paths-filter@v2
        with:
          filters: |
           databasefolder: 'sources/ConsoleDatabase/**'
     
  build:
    name: Database Changes Detected - Build
    needs: check-changes
    if: needs.check-changes.outputs.databasechanged == 'true'
    uses: dcorlier/hbb/.github/workflows/build-database.yml@develop

  skip-build:
    name: No database changes detected - Skip
    needs: check-changes
    if: needs.check-changes.outputs.databasechanged == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "no changes in the database project => Build skipped."
